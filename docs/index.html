<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 HTML 報告範例</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
    h1 { color: #0366d6; border-bottom: 2px solid #eaecef; padding-bottom: 10px; }
    .info-box { background: #f6f8fa; padding: 15px; border-radius: 6px; border-left: 4px solid #0366d6; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>我的 HTML 報告範例</h1>
  <div class="info-box">
    <p>這是一個簡單的 HTML 報告範例，用於展示 GitHub Pages 的功能。</p>
    <p><strong>產生時間：</strong> <script>document.write(new Date().toLocaleString());</script></p>
  </div>
  <h2>使用說明</h2>
  <ol>
    <li>將你的 HTML 檔案放在 <code>docs/</code> 資料夾中。</li>
    <li>推送到 GitHub 後，在設定裡開啟 GitHub Pages。</li>
    <li>點擊右上角連結即可在瀏覽器中檢視。</li>
  </ol>
</body>
</html>
